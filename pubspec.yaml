name: citylibrary
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.5.3

#==================================  Dependencies  Section  ==============================
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # an svg package to render SVG images in Flutter
  flutter_svg: ^2.0.9
  # a package for adaptive and responsive screen design in Flutter
  flutter_screenutil: ^5.9.3
  # dependency to can make icon for my app
  flutter_launcher_icons: ^0.13.1
  # dependency for handle OnBoarding dots indicator
  dots_indicator: ^3.0.0
  # dependency for my local storage using shared preferences
  shared_preferences: ^2.3.2
  # dependency for my services
  get_it: ^8.0.0
  # dependency for either return type
  dartz: ^0.10.1
  # dependency for state managment
  flutter_bloc: ^8.1.6
  # dependency for loading indicator
  modal_progress_hud_nsn: ^0.5.0
  # dependency for comparison between two objects
  equatable: ^2.0.5

  # firebase dependencies
  # firebase_core: ^3.6.0
  #firebase_auth: ^5.3.1
  #cloud_firestore: ^5.4.4
  #email_validator: ^3.0.0
  #ersistent_bottom_nav_bar: ^6.2.1

#==================================  Dev  Dependencies  Section  ==============================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  flutter_lints: ^4.0.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  adaptive_icon_background: "#A67C52"
  adaptive_icon_foreground: "assets/logo.png"

#==================================  Flutter  Section Add Images and Fonts ==============================
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/svgs/

  # To add assets to your application, add an assets section, like this:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700

#==================================  Generate  Flutter  Assets  Section  ==============================
flutter_assets:
  assets_path: assets/svgs/
  output_path: lib/core/theme/
  filename: assets.dart
